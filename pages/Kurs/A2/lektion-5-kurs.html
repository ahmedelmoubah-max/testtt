<style>
:root{--ink:#163b66;--muted:#67809a;--blue:#087bd4;--border:#d3e5f5;--accent:#f4a52c}
*{box-sizing:border-box}

button{font-family:inherit}
.shell{width:min(1060px,calc(100% - 24px));margin:18px auto 32px}
.top{display:flex;direction:ltr;justify-content:flex-start;align-items:center;gap:18px;margin-bottom:14px;text-align:left}
.lesson-kicker{font-size:13px;color:#477da9;font-weight:700;margin-bottom:5px}

.note-top{max-width:335px;background:white;border:1px solid var(--border);border-radius:14px;padding:12px 15px;font-size:13px;line-height:1.7;color:#637d97}
.deck{background:#fff;border:1px solid var(--border);border-radius:24px;padding:17px;box-shadow:0 15px 45px #16508d13}
.section-bar{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:13px}

.section-heading .section-de{direction:ltr}
.section-heading .section-ar{font-size:.73em;font-weight:600;color:#6582a3}
.counter{direction:ltr;white-space:nowrap;border-radius:100px;background:#eaf4fc;border:1px solid #d4e9f7;padding:6px 13px;font-weight:700;color:#49759c;font-size:13px}
.viewport{min-height:320px;background:linear-gradient(145deg,#fff,#f5faff);border:1px solid #e5eff8;border-radius:20px;padding:16px;outline-offset:3px;touch-action:pan-y}
.slide{display:none;animation:fadein .24s ease}
.slide.active{display:block}
@keyframes fadein{from{opacity:.5;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.slide-head{direction:ltr;display:flex;align-items:center;gap:8px;margin-bottom:14px;font-weight:800;color:var(--accent)}
.slide-head::before{content:'';width:7px;height:24px;border-radius:6px;background:var(--accent)}
.cards{direction:ltr;display:grid;gap:12px}
.city-grid{grid-template-columns:repeat(4,minmax(0,1fr))}
.transport-grid,.adj-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
.item{direction:ltr;min-width:0;display:flex;align-items:center;flex-direction:column;justify-content:flex-start;gap:3px;position:relative;border:1px solid #dbe8f5;background:#fff;border-radius:15px;padding:10px 7px 12px;cursor:pointer;color:var(--ink);box-shadow:0 3px 11px #093f7d0b;transition:box-shadow .14s,border-color .14s,transform .14s}
.item:hover{border-color:var(--accent);box-shadow:0 7px 18px #1c548c20;transform:translateY(-2px)}
.item:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.item img{height:76px;width:100%;max-width:180px;object-fit:contain;display:block;margin-bottom:4px;pointer-events:none}
.item .de-label{font-weight:800;line-height:1.28;font-size:clamp(14px,1.8vw,20px);color:#173775;white-space:normal;overflow-wrap:normal;text-align:center;direction:ltr;hyphens:none}
.item .ar-label{font-weight:700;font-size:clamp(12px,1.5vw,16px);line-height:1.45;text-align:center;direction:rtl;color:#236097}
.item .speaker{position:absolute;top:7px;right:8px;font-size:12px;color:#7391ae}
.city-grid .item{min-height:143px}
.city-grid .item img{height:81px}
.transport-grid .item{min-height:165px}
.transport-grid .item img{height:95px}
.adj-grid .item{min-height:137px}
.adj-grid .item img{height:72px}
.home-layout{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:14px;direction:ltr}
.rooms{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.room.item{min-height:194px;padding-top:8px}
.room.item img{height:116px;max-width:100%;width:100%;object-fit:cover;border-radius:9px;object-position:center}
.home-words{display:grid;grid-template-columns:1fr;gap:8px}
.home-word.item{min-height:63px;padding:5px 11px;flex-direction:row;justify-content:flex-start;gap:11px;text-align:left}
.home-word.item img{width:50px;min-width:50px;height:48px;max-width:50px;margin:0;object-fit:contain}
.home-word .label-stack{display:flex;flex:1;flex-direction:column;align-items:flex-start;gap:2px;min-width:0}
.home-word .de-label{font-size:17px;text-align:left}
.home-word .ar-label{font-size:14px;text-align:right}
.home-word .speaker{top:5px;right:7px}
.verbs-list{grid-template-columns:1fr;gap:8px;max-width:790px;margin:0 auto}
.verb.item{flex-direction:row;justify-content:flex-start;gap:14px;min-height:58px;padding:7px 18px;text-align:left;background:linear-gradient(90deg,#f9fffc,#e8f9f2);border-color:#cdeadd}
.verb.item img{height:44px;width:60px;min-width:60px;margin:0}
.verb .de-label{flex:1;text-align:left;font-size:18px}
.verb .ar-label{text-align:right;font-size:16px;min-width:115px}
.sentences-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.sentence.item{flex-direction:row;justify-content:flex-start;gap:12px;min-height:85px;padding:10px 13px;text-align:left;background:linear-gradient(100deg,#fff,#f0f9ff)}
.sentence.item img{width:55px;min-width:55px;height:54px;max-width:55px;margin:0}
.sentence .label-stack{min-width:0;flex:1;display:flex;align-items:flex-start;flex-direction:column;gap:5px}
.sentence .de-label{font-size:17px;text-align:left}
.sentence .ar-label{font-size:15px;text-align:right}
.controls{display:flex;justify-content:space-between;align-items:center;gap:10px;direction:ltr;margin:14px 0 6px}
.nav{border:0;border-radius:12px;background:var(--blue);color:#fff;cursor:pointer;padding:11px 17px;font-weight:800;min-width:104px;font-size:14px}
.nav:hover:not(:disabled){background:#066ab8}
.nav:disabled{background:#dce7f0;color:#7f97ac;cursor:default}
.dots{display:flex;align-items:center;gap:7px}
.dot{width:11px;height:11px;border-radius:99px;border:0;background:#c6d9e8;padding:0;cursor:pointer}
.dot[aria-current=step]{width:25px;background:var(--accent)}
.tabs{display:flex;gap:9px;overflow-x:auto;direction:ltr;padding:12px 1px 4px;scrollbar-width:thin}
.tab{flex:none;border:1px solid #cce0f2;background:#f9fcff;border-radius:12px;padding:9px 13px;font-size:13px;color:#29537a;font-weight:700;cursor:pointer;direction:rtl}
.tab span{display:block;direction:ltr;font-size:11px;font-weight:600;color:#6788a8;margin-top:2px}
.tab[aria-selected=true]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:#fffaf1}
.modal-bg{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#061d3b99;z-index:20;padding:14px}
.modal-bg.open{display:flex}
.modal{background:#fff;border-radius:20px;width:min(510px,100%);overflow:hidden;box-shadow:0 24px 74px #07182d55}
.modal-header{display:flex;justify-content:space-between;align-items:center;padding:15px 18px;background:linear-gradient(120deg,#0b8de4,#1952ab);color:white;font-weight:700}
.modal-header button{background:#ffffff30;color:white;border:0;border-radius:8px;height:35px;width:35px;font-size:25px;cursor:pointer}
.modal-content{padding:20px}
.modal-de{font-size:27px;font-weight:800;color:#153e7c;line-height:1.5;direction:ltr;text-align:left;margin:0 0 9px}
.modal-ar{font-size:23px;color:#20533c;line-height:1.7;direction:rtl;margin:0 0 15px}
.modal-actions{display:flex;gap:9px;flex-wrap:wrap}
.modal-actions button{flex:1;min-width:155px;border:0;border-radius:12px;padding:12px 13px;font-size:14px;font-weight:700;cursor:pointer;background:#087bd4;color:#fff}
.modal-actions button+button{background:#ecf6ff;color:#1159a5;border:1px solid #d0e5f8}
.tip{font-size:12px;color:#6c849e;line-height:1.6;margin:13px 0 0}
@media(max-width:790px){.home-layout{grid-template-columns:1fr}.rooms{grid-template-columns:repeat(2,minmax(0,1fr))}.home-words{grid-template-columns:repeat(2,minmax(0,1fr))}.city-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:560px){.shell{width:calc(100% - 12px);margin:7px auto}.top{display:block;padding:3px 8px}.note-top{padding:4px 0;border:0;background:transparent;margin-top:3px;max-width:none}.deck{padding:10px;border-radius:17px}.viewport{padding:8px;border-radius:12px;min-height:230px}.cards{gap:8px}.city-grid,.transport-grid,.adj-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.city-grid .item{min-height:136px}.city-grid .item img{height:73px}.transport-grid .item{min-height:147px}.transport-grid .item img{height:75px}.home-words{grid-template-columns:1fr}.room.item{min-height:156px}.room.item img{height:97px}.item .de-label{font-size:15px}.item .ar-label{font-size:13px}.verb.item{padding:7px;gap:7px}.verb.item img{width:43px;min-width:43px;height:36px}.verb .de-label{font-size:14px}.verb .ar-label{font-size:13px;min-width:77px}.sentence.item .de-label{font-size:16px}.sentences-grid{grid-template-columns:1fr}.sentence.item{min-height:71px}.nav{min-width:85px;padding:10px 9px;font-size:12px}.section-heading{font-size:18px}.modal-de{font-size:23px}.modal-ar{font-size:20px}}
@media(max-width:360px){.rooms{grid-template-columns:1fr}.city-grid .item img{height:61px}.item .de-label{font-size:13px}}
@media(prefers-reduced-motion:reduce){.slide{animation:none}.item{transition:none}}

/* Interactive exercises between lesson slides */
.quiz-panel{margin-top:14px;border-radius:20px;border:1px solid #cddff2;background:#fff;padding:17px;box-shadow:0 8px 24px #0e548214}
.quiz-panel[hidden]{display:none!important}
.quiz-head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:9px;margin-bottom:10px}
.quiz-heading{font-size:20px;font-weight:800;color:#144777}
.quiz-counter{background:#eaf3ff;border-radius:40px;padding:7px 12px;color:#205787;font-weight:700;direction:ltr}
.quiz-track{height:9px;background:#e5eef7;border-radius:30px;overflow:hidden;margin-bottom:17px}
.quiz-track>div{height:100%;width:0;background:linear-gradient(90deg,#1d9cd5,#2cb27b);transition:width .25s}
.quiz-question{font-size:clamp(18px,2.5vw,23px);font-weight:800;margin:10px 0 16px;line-height:1.7;text-align:center}
.quiz-target{font-size:clamp(23px,3.5vw,31px);font-weight:900;color:#1456a0;direction:ltr;text-align:center;margin:12px auto;max-width:100%;overflow-wrap:anywhere}
.quiz-options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:16px auto;max-width:820px}
.quiz-option{background:#f8fbff;border:2px solid #d7e6f4;border-radius:13px;padding:14px 10px;min-height:66px;cursor:pointer;color:#173f6b;font-size:17px;font-weight:700;line-height:1.5;overflow-wrap:anywhere}
.quiz-option:hover:not(:disabled){border-color:#3f94d4;background:#ebf6ff}
.quiz-option.correct{border-color:#16a66a;background:#e4f9ee;color:#07633c}
.quiz-option.wrong{border-color:#de5b5b;background:#fff0f0;color:#9a3030}
.quiz-option:disabled{cursor:default}
.quiz-feedback{border-radius:12px;padding:11px 15px;font-size:16px;font-weight:700;line-height:1.6;margin-top:12px}
.quiz-feedback.ok{background:#e7f8ef;color:#075f3e}
.quiz-feedback.no{background:#fff1ec;color:#983e27}
.quiz-foot{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-top:14px}
.quiz-go{border:0;background:#087bd4;color:#fff;border-radius:12px;padding:12px 20px;font-weight:800;font-size:16px;cursor:pointer}
.quiz-go:disabled{opacity:.45;cursor:not-allowed}
.quiz-secondary{border:1px solid #c9dbed;background:white;color:#285d88;border-radius:12px;padding:10px 13px;font-weight:700;cursor:pointer}
.quiz-picture{width:min(190px,80%);height:135px;object-fit:contain;display:block;margin:8px auto;background:#fff;border:1px solid #e0ebf5;border-radius:14px;padding:7px}
.quiz-sound{display:block;margin:15px auto;background:#e8f4ff;border:1px solid #add3f2;border-radius:12px;padding:13px 22px;color:#115b9c;font-weight:800;font-size:17px;cursor:pointer}
.quiz-result{text-align:center;padding:20px 5px}
.quiz-result h3{font-size:26px;color:#14518c;margin:0 0 12px}
.quiz-result strong{font-size:35px;color:#16855c}
.quiz-result p{line-height:1.8}
.quiz-stage-note{font-size:14px;color:#587994;line-height:1.7}
@media(max-width:600px){.quiz-options{grid-template-columns:1fr}.quiz-panel{padding:12px}.quiz-option{font-size:16px;min-height:56px}}

/* Ten varied exercises per stage */
.quiz-panel{padding:clamp(12px,2.3vw,24px)}
.quiz-head{margin-bottom:13px}
.quiz-kind{display:inline-flex;align-items:center;gap:7px;border:1px solid #cce1f4;background:#f4faff;padding:7px 12px;border-radius:99px;font-weight:800;font-size:14px;color:#1d6196}
.quiz-counter{font-size:14px}
.quiz-instruction{text-align:center;font-weight:800;color:#164777;line-height:1.75;font-size:clamp(17px,2.7vw,22px);margin:12px auto 6px}
.quiz-hint{display:block;text-align:center;color:#426f99;font-size:15px;line-height:1.6;margin:0 auto 12px}
.quiz-target{direction:ltr;font-weight:900;font-size:clamp(23px,3.7vw,32px);color:#123f85;background:#f0f7ff;border:1px solid #d7e9f8;padding:14px 18px;border-radius:15px;max-width:640px;margin:13px auto;text-align:center;line-height:1.6}

.quiz-tile:hover:not(:disabled),.quiz-tile:focus-visible{background:#e7f4ff;border-color:#3a91cd}

.quiz-input{display:block;margin:16px auto 8px;max-width:510px;width:100%;border:2px solid #bbd6ed;border-radius:13px;line-height:1.6;text-align:left;direction:ltr;padding:12px 17px;color:#183f69;background:#fff;font-size:19px;font-weight:700}
.quiz-input:focus{outline:3px solid #b4e3ff;outline-offset:1px;border-color:#168ac9}
.quiz-audio{display:flex;align-items:center;justify-content:center;min-height:102px}
.quiz-sound{margin:10px auto;background:#e8f5ff;color:#155c9e;border:2px solid #a9d5f3;box-shadow:0 4px 0 #d5eaf9;font-size:18px}
.quiz-sound:hover{background:#d7eefe}
.quiz-feedback{max-width:810px;margin:13px auto 0;text-align:center;line-height:1.8;overflow-wrap:anywhere}
.quiz-feedback .correct-answer{display:block;direction:ltr;margin-top:3px;font-size:18px;color:#133f7c}
.quiz-foot{border-top:1px solid #e4edf6;padding-top:13px;margin-top:18px}
.quiz-result{max-width:650px;margin:auto}
.quiz-result .quiz-kind{margin:0 auto 15px}

function makeCard(item,section,index){

 const btn=el('button','item '+cls);btn.type='button';btn.setAttribute('aria-label',item.de+' — '+item.ar);
 btn.title=item.de+' — '+item.ar;
 const img=el('img');img.src=item.image;img.alt='';img.draggable=false;img.loading='eager';btn.appendChild(img);

 btn.addEventListener('click',()=>openItem(item));return btn;
}

const QUIZ_TOTAL=10;

function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function shuffledOutOfOrder(values){let mixed=shuffle(values);for(let tries=0;tries<10&&mixed.every((v,i)=>v.id===values[i].id);tries++)mixed=shuffle(values);if(mixed.every((v,i)=>v.id===values[i].id)&&values.length>1)mixed=[...values.slice(1),values[0]];return mixed}
function normalizeAnswer(value){return String(value).normalize('NFC').toLowerCase().trim().replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss').replace(/[.!?,،؟؛:]/g,'').replace(/\s+/g,' ')}
function quizChoices(item,other,field){return shuffle([item[field],...shuffle(other.filter(x=>x[field]!==item[field])).slice(0,3).map(x=>x[field])])}
function spellingItems(section){
 if(section.id==='sentences')return [{word:'Brot',ar:'الخبز'},{word:'Chips',ar:'شيبس'},{word:'Speisekarte',ar:'قائمة الطعام'},{word:'Rechnung',ar:'الفاتورة'}];
 return section.items.map(it=>({word:section.id==='verbs'?(it.speak||it.de).split(',')[0]:it.de.replace(/^(?:der|die|das)\s+/i,'').replace(/^zu\s+/i,'').replace(/^ohne\s+/i,''),ar:it.ar})).filter(it=>/^[\p{L}]+$/u.test(it.word)&&[...it.word].length>=4&&[...it.word].length<=11);
}
function writingItems(section){
 if(section.id==='sentences')return section.items.filter(it=>!it.de.includes(' / ')&&!it.de.includes('...'));

}
function makeQuestions(section){
 const items=section.items,meanA=items[0],meanB=items[Math.floor(items.length/2)];
 const pool=shuffle(spellingItems(section));
 const written=shuffle(writingItems(section));
 const audible=shuffle(items);
 const examples=SENTENCE_EXAMPLES[section.id];
 const meanings=[meanA,meanB];
 const spelling=[pool[0],pool[1]||pool[0]];
 const sentences=shuffle(examples);
 const listening=[audible[0],audible[1]];
 const writing=[written[0],written[1]];
 const questions=[];
 for(let i=0;i<10;i++){
  const kind=QUIZ_TYPES[i],position=Math.floor(i/5),item={meaning:meanings,letters:spelling,sentence:sentences,listen:listening,write:writing}[kind][position];
  if(kind==='meaning')questions.push({kind,prompt:'شنو المعنى الصحيح لهاد الكلمة بالألمانية؟',target:item.de,answer:item.ar,options:quizChoices(item,items.filter(x=>x!==item),'ar')});
  if(kind==='letters')questions.push({kind,prompt:'الحروف مبعثرة! رتبهم باش تكتب الكلمة الألمانية.',target:item.ar,answer:item.word,letters:true});
  if(kind==='sentence')questions.push({kind,prompt:'رتب الكلمات باش تركّب الجملة الألمانية الصحيحة.',target:item.ar,answer:item.de,words:true});
  if(kind==='listen')questions.push({kind,prompt:'سمع الكلمة بالألمانية، ومن بعد اختار المعنى الصحيح.',answer:item.ar,speak:item.speak||item.de,options:quizChoices(item,items.filter(x=>x!==item),'ar')});
  if(kind==='write')questions.push({kind,prompt:'شوف المعنى بالعربية، واكتب المقابل ديالو بالألمانية.',target:item.ar,answer:item.de,writing:true});
 }
 return questions;
}

  if(q.kind==='listen'){
   const audio=quizElement('div','quiz-audio');const play=quizElement('button','quiz-sound','🔊 اضغط باش تسمع الكلمة');play.type='button';play.onclick=()=>speak(q.speak,'de-DE');audio.append(play);quizPanel.append(audio);
   quizPanel.append(quizElement('div','quiz-hint','تقدر تسمع الكلمة أكثر من مرة قبل الجواب.'));
  }
  const options=quizElement('div','quiz-options');
  q.options.forEach(value=>{
   const btn=quizElement('button','quiz-option',value);btn.type='button';btn.lang='ar';interactive.push(btn);
   btn.onclick=()=>{if(quizAnswered)return;showResult(value===q.answer);[...options.children].forEach(b=>{if(b.textContent===q.answer)b.classList.add('correct');else if(b===btn)b.classList.add('wrong')})};
   options.append(btn);
  });quizPanel.append(options);
 }else if(q.kind==='letters'||q.kind==='sentence'){
  const symbols=q.kind==='letters'?Array.from(q.answer):q.answer.replace(/[.!?]+$/,'').trim().split(/\s+/);
  const tiles=shuffledOutOfOrder(symbols.map((val,id)=>({val,id})));let selected=[];
  const answerBox=quizElement('div','quiz-constructed');answerBox.setAttribute('aria-label','الكلمة أو الجملة اللي كتكوّن');
  const options=quizElement('div','quiz-tiles');
  function redraw(){
   answerBox.replaceChildren();
   if(!selected.length)answerBox.append(quizElement('span','quiz-placeholder','اضغط على الحروف أو الكلمات بالترتيب الصحيح'));
   selected.forEach(tile=>{const chip=quizElement('button','quiz-tile quiz-picked',tile.val);chip.type='button';chip.title='اضغط باش تحيد هاد العنصر';chip.disabled=quizAnswered;chip.onclick=()=>{selected=selected.filter(t=>t.id!==tile.id);redraw()};answerBox.append(chip)});
   options.replaceChildren();tiles.forEach(tile=>{const btn=quizElement('button','quiz-tile',tile.val);btn.type='button';btn.disabled=quizAnswered||selected.some(t=>t.id===tile.id);btn.onclick=()=>{selected.push(tile);redraw()};options.append(btn)});
   check.disabled=quizAnswered||selected.length!==symbols.length;
  }
  const actions=quizElement('div','quiz-actions');const reset=quizElement('button','quiz-reset','↶ مسح الترتيب');reset.type='button';reset.onclick=()=>{selected=[];redraw()};
  const check=quizElement('button','quiz-check','✔ تحقق من الجواب');check.type='button';check.onclick=()=>{if(selected.length!==symbols.length||quizAnswered)return;const value=q.kind==='letters'?selected.map(t=>t.val).join(''):selected.map(t=>t.val).join(' ');showResult(normalizeAnswer(value)===normalizeAnswer(q.answer));redraw();reset.disabled=true};
  interactive.push(reset,check);
  quizPanel.append(answerBox,options);actions.append(reset,check);quizPanel.append(actions);redraw();
 }else if(q.kind==='write'){
  quizPanel.append(quizElement('div','quiz-hint','اكتب بالألمانية. الأحرف الكبيرة والصغيرة مقبولة، وحتى ae بدل ä و ss بدل ß.'));
  const input=quizElement('input','quiz-input');input.type='text';input.lang='de';input.dir='ltr';input.autocomplete='off';input.autocapitalize='off';input.spellcheck=false;input.placeholder='Schreib auf Deutsch ...';input.setAttribute('aria-label','كتب الجواب بالألمانية');
  const actions=quizElement('div','quiz-actions'),check=quizElement('button','quiz-check','✔ تحقق من الكتابة');check.type='button';check.disabled=true;
  input.addEventListener('input',()=>{check.disabled=quizAnswered||!input.value.trim()});
  input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!check.disabled){e.preventDefault();check.click()}});
  check.onclick=()=>showResult(normalizeAnswer(input.value)===normalizeAnswer(q.answer));
  interactive.push(input,check);actions.append(check);quizPanel.append(input,actions);
 }
 quizPanel.append(feedback);bottom.append(next,score);quizPanel.append(bottom);
}
function finishQuiz(){
 progress[current]={done:true,score:quizScore};quizPanel.replaceChildren();
 const result=quizElement('div','quiz-result');result.append(quizElement('div','quiz-kind','🏁 نتيجة المرحلة'));
 result.append(quizElement('h3','','كملتي 10 تمارين ديال هاد المرحلة!'));
 result.append(quizElement('strong','',quizScore+' / '+QUIZ_TOTAL));
 result.append(quizElement('p','','النتيجة: '+Math.round(quizScore/QUIZ_TOTAL*100)+'% — تقدر تعاود التمارين باش تحسّن النتيجة.'));
 const actions=quizElement('div','quiz-foot');actions.style.justifyContent='center';
 const retry=quizElement('button','quiz-secondary','↻ عاود 10 تمارين');retry.onclick=()=>{quizMode=false;startQuiz()};
 if(current<SECTIONS.length-1){
  const continueBtn=quizElement('button','quiz-go','المرحلة الموالية ❯');
  continueBtn.onclick=()=>{quizMode=false;quizPanel.hidden=true;viewport.hidden=false;goTo(current+1)};
  actions.append(retry,continueBtn);
 }else{
  result.append(quizElement('p','quiz-finish-note','🎉 كملتي جميع المراحل!'));
  actions.append(retry);
 }
 result.append(actions);quizPanel.append(result);
 document.getElementById('next').hidden=true;updateTabs();
}
function updateTabs(){
 [...tabs.children].forEach((t,i)=>{t.firstChild.textContent=SECTIONS[i].ar+(progress[i].done?' ✓':'');t.title=i>0&&progress.slice(0,i).some(p=>!p.done)?'كمل تمارين المراحل السابقة أولاً':''});
}
function goTo(index){
 if(index<0||index>=SECTIONS.length)return;
 if(index>0&&progress.slice(0,index).some(p=>!p.done))return;
 if(quizMode)return;
 current=index;document.querySelector('.controls').classList.remove('quiz-active');document.getElementById('next').hidden=false;document.getElementById('prev').textContent='❮ السابق';
 const s=SECTIONS[index];document.documentElement.style.setProperty('--accent',s.color);
 const h=document.getElementById('sectionHeading');h.querySelector('.section-de').textContent=s.title;h.querySelector('.section-ar').textContent='— '+s.ar;
 document.getElementById('slideCount').textContent=(index+1)+' / '+SECTIONS.length;
 [...viewport.children].forEach((slide,j)=>{const shown=j===index;slide.classList.toggle('active',shown);slide.setAttribute('aria-hidden',String(!shown));slide.querySelectorAll('button').forEach(b=>b.tabIndex=shown?0:-1)});
 [...dots.children].forEach((b,j)=>{if(j===index)b.setAttribute('aria-current','step');else b.removeAttribute('aria-current')});
 [...tabs.children].forEach((b,j)=>{b.setAttribute('aria-selected',String(j===index));b.tabIndex=j===index?0:-1});
 document.getElementById('prev').disabled=index===0;document.getElementById('next').disabled=false;
 document.getElementById('next').textContent=progress[index].done?(index===SECTIONS.length-1?'راجع التمارين ❯':'المرحلة الموالية ❯'):'ابدأ 10 تمارين ❯';
 updateTabs();
}
function forward(){
 if(quizMode)return;
 if(!progress[current].done||current===SECTIONS.length-1){startQuiz();return}
 goTo(current+1);
}
function backward(){if(quizMode)return;goTo(current-1)}

function speak(value,lang){
 if(!('speechSynthesis' in window))return;
 window.speechSynthesis.cancel();const utterance=new SpeechSynthesisUtterance(value);utterance.lang=lang;
 const voices=window.speechSynthesis.getVoices();const selected=voices.find(v=>v.lang.toLowerCase().startsWith(lang.substring(0,2).toLowerCase()));
 if(selected)utterance.voice=selected;utterance.rate=.9;window.speechSynthesis.speak(utterance);
}
function openItem(item){
 active=item;previousFocus=document.activeElement;deText.textContent=item.de;arText.textContent=item.ar;
 overlay.classList.add('open');overlay.setAttribute('aria-hidden','false');document.getElementById('closeBtn').focus();
 setTimeout(()=>{if(overlay.classList.contains('open')&&active===item)speak(item.speak||item.de,'de-DE')},80);
}
function closeModal(){
 if(!overlay.classList.contains('open'))return;
 overlay.classList.remove('open');overlay.setAttribute('aria-hidden','true');if('speechSynthesis' in window)window.speechSynthesis.cancel();
 if(previousFocus&&previousFocus.isConnected)previousFocus.focus();
}
document.getElementById('prev').addEventListener('click',backward);document.getElementById('next').addEventListener('click',forward);
document.getElementById('closeBtn').addEventListener('click',closeModal);
window.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();return}if(overlay.classList.contains('open'))return;if(quizMode)return;if(e.key==='ArrowLeft'){e.preventDefault();backward()}if(e.key==='ArrowRight'){e.preventDefault();forward()}});
overlay.addEventListener('click',e=>{if(e.target===overlay)closeModal()});
document.getElementById('playDe').addEventListener('click',()=>active&&speak(active.speak||active.de,'de-DE'));
document.getElementById('playAr').addEventListener('click',()=>active&&speak(active.ar,'ar-MA'));
let swipe=null;viewport.addEventListener('touchstart',e=>{if(e.touches.length===1)swipe={x:e.touches[0].clientX,y:e.touches[0].clientY}},{passive:true});
viewport.addEventListener('touchend',e=>{if(!swipe||e.changedTouches.length!==1)return;const x=e.changedTouches[0].clientX-swipe.x,y=e.changedTouches[0].clientY-swipe.y;if(Math.abs(x)>55&&Math.abs(x)>Math.abs(y)*1.3)(x<0?forward():backward());swipe=null},{passive:true});
renderSlides();goTo(0);
// Native course-owned resume (v7): run before parent iframe 'load' event.
// The course NEVER replaces the student's last stage with its default 1/6.
window.DeutschCourseNativeSyncV7=(function(){
  let launch=null,account='standalone',nativeKey='',restored=false;
  try{
    launch=JSON.parse(sessionStorage.getItem('deutsch_course_launch_v7:'+location.pathname)||'null');
    if(!launch || launch.version!==7 || Date.now()-Number(launch.issuedAt)>3600000)launch=null;
    if(launch?.student)account=String(launch.student);
  }catch(e){launch=null}
  nativeKey='deutsch_course_native_v7:'+account+':'+location.pathname;
  const safeStore=(payload)=>{try{localStorage.setItem(nativeKey,JSON.stringify(payload))}catch(e){}};
  const safeRead=()=>{try{return JSON.parse(localStorage.getItem(nativeKey)||'null')}catch(e){return null}};
  // The parent account-scoped record takes priority over standalone cache.
  // A restart is an EXPLICIT instruction, never use stale local data in that case.
  const localCopy=safeRead();
  const parentCopy=launch?.saved||null;
  // A late/stale platform write must not override a newer native cursor.
  const nativeIsNewer=!!(localCopy && parentCopy &&
    Date.parse(localCopy.updatedAt||0)>Date.parse(parentCopy.updatedAt||0));
  const saved=(launch?.mode==='resume' ? (nativeIsNewer?localCopy:(parentCopy||localCopy)) :
    !launch ? localCopy : null);
  if(launch?.mode==='restart' || launch?.mode==='new'){
    try{localStorage.removeItem(nativeKey)}catch(e){}
  }
  if(saved && typeof saved==='object' && Number.isInteger(Number(saved.lastTab))){
    try{
      const stages=Array.isArray(saved.nativeStages)?saved.nativeStages:[];
      let target=Math.min(SECTIONS.length-1,Math.max(0,Math.trunc(Number(saved.lastTab))));
      // Repair cursor=0 saved by the old iframe-only bridge if the record
      // proves the student had already reached later sections.
      if(target===0 && Number(saved.nativeResumeVersion)!==7){
        const visited=Array.isArray(saved.visitedTabs)?saved.visitedTabs:[];
        const highest=Math.max(0,...visited.filter(n=>Number.isInteger(n)&&n<SECTIONS.length));
        if(highest>0)target=highest;
        else if(stages.some(v=>v?.done)){
          let firstUnfinished=0;
          while(firstUnfinished<stages.length-1 && stages[firstUnfinished]?.done)firstUnfinished++;
          target=Math.min(SECTIONS.length-1,firstUnfinished);
        }
      }
      // Original app versions stored the cursor without the quiz milestones.
      // The lesson requires all previous stages to be done to visit stage N.
      progress.forEach((stage,i)=>{
        if(stages[i]){
          stage.done=!!stages[i].done;
          stage.score=Math.max(0,Number(stages[i].score)||0);
        }else if(!stages.length && i<target){stage.done=true;}
      });
      for(let i=0;i<target;i++)if(!progress[i].done)progress[i].done=true;
      updateTabs();
      goTo(target);
      restored=current===target;
      if(restored && saved.nativeQuiz?.active){
        const quiz=saved.nativeQuiz;
        startQuiz();
        if(Array.isArray(quiz.questions) && quiz.questions.length===QUIZ_TOTAL){
          quizQuestions=quiz.questions.slice();
        }
        quizScore=Math.max(0,Number(quiz.score)||0);
        const wasAnswered=quiz.answered===true;
        const previousIndex=Math.max(0,Math.min(QUIZ_TOTAL-1,Math.trunc(Number(quiz.index)||0)));
        // Move to the next question if the previous one was already graded;
        // don't let the student collect the same point twice.
        quizIndex=Math.min(QUIZ_TOTAL-1,previousIndex+(wasAnswered&&previousIndex<QUIZ_TOTAL-1?1:0));
        renderQuestion();
      }
      if(restored && Number(saved.scrollTop)>0){
        setTimeout(()=>window.scrollTo(0,Number(saved.scrollTop)),80);
      }
    }catch(error){console.warn('Kurs native restore failed',error)}
  }
  function save(){
    try{
      const old=safeRead()||{};
      const payload={...old,nativeResumeVersion:7,lastTab:current,totalTabs:SECTIONS.length,
        nativeStages:progress.map(s=>({done:!!s.done,score:Number(s.score)||0})),
        nativeQuiz:quizMode?{active:true,index:quizIndex,score:quizScore,
          answered:quizAnswered,questions:quizQuestions}:null,
        completed:progress.every(s=>s.done),scrollTop:Math.max(0,window.scrollY||0),
        updatedAt:new Date().toISOString()};
      safeStore(payload);
      // The authenticated parent writes its own per-student course record.
      // Report only after the course's real current stage exists.
      if(window.parent!==window){
        window.parent.postMessage({type:'deutsch-a1-course-progress',
          slideIndex:current,totalSlides:SECTIONS.length,
          label:SECTIONS[current]?.ar||'',completed:payload.completed},'*');
        window.parent.postMessage({type:'deutsch-course-native-state-v7',
          level:launch?.level||'A2',lessonNumber:launch?.no||5,
          state:payload},'*');
      }
      return payload;
    }catch(error){return null}
  }
  // Do not record the initial 1/6 until hydration is complete.
  setTimeout(save,0);
  document.addEventListener('click',()=>setTimeout(save,0),true);
  document.addEventListener('input',()=>setTimeout(save,0),true);
  window.addEventListener('pagehide',save);
  window.addEventListener('visibilitychange',()=>{if(document.hidden)save()});
  window.addEventListener('beforeunload',save);
  // Each quiz transition is a semantic state change, even when no tab moved.
  for(const method of ['goTo','startQuiz','renderQuestion','finishQuiz']){
    let original;try{original=eval(method)}catch(e){continue}
    if(typeof original!=='function')continue;
    const wrapped=function(...args){const val=original.apply(this,args);save();return val};
    try{eval(method+'=wrapped')}catch(e){}
  }
  return {save,get restored(){return restored},get launch(){return launch}};
})();
// Embedded lesson progress contract: report the exact current stage and graded quiz
// to the hosting platform. The parent stores it per student, never globally.
(function(){
  function report(){
    try{
      if(window.parent===window)return;
      const bridge=window.DeutschLessonIntegration;
      if(bridge&&typeof bridge.save==='function'){
        bridge.save({slideIndex:current,totalSlides:SECTIONS.length,label:SECTIONS[current]?.ar||'',
          completed:progress.every(s=>s.done)});
      }
      window.parent.postMessage({type:'deutsch-a1-course-progress',slideIndex:current,
        totalSlides:SECTIONS.length,label:SECTIONS[current]?.ar||'',
        completed:progress.every(s=>s.done)},'*');
    }catch(err){}
  }
  const nativeGoTo=goTo;
  goTo=function(index){const result=nativeGoTo(index);report();return result;};
  const nativeStartQuiz=startQuiz;
  startQuiz=function(){const result=nativeStartQuiz();report();return result;};
  const nativeFinishQuiz=finishQuiz;
  finishQuiz=function(){const result=nativeFinishQuiz();report();return result;};
  window.addEventListener('pagehide',report);
})();
</script>
